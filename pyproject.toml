[project]
name = "llm-platform"
version = "0.0.1"
description = "A LoRA-fine-tuned open model that extracts findings from home-inspection reports, served with vLLM, driven by a LangGraph agent"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Chandana Sorakundla" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_platform"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["llm_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Stack tests are deselected here rather than skipped inside the test, so a clean clone with
# no Docker runs `make check` green (Gate 0's first clause). `make test-stack` opts in after
# `make up` (Gate 0's second clause).
addopts = "-q -m 'not stack' --cov=llm_platform --cov-report=term-missing --cov-fail-under=80"
markers = [
    "stack: needs the local stack from `make up` - Postgres+pgvector on 5432, Langfuse on 3000",
]
